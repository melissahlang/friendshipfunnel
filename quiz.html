<style>
:root{--bg:#FFF9F4;--ink:#1B2A4A;--coral:#FF5A3C;--coral-d:#C8361B;--peach:#FF8A6E;--blush:#FFB8A6;--cream:#FFE3D8;--mut:#5A6478;--mut2:#3E4A60;--white:#FFFFFF;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Red Rose","Noto Sans Thai",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
.hero{position:relative;background:var(--peach);border-bottom:2px solid var(--ink);padding-bottom:34px}

.brand{font-size:17px;line-height:1.1;letter-spacing:-.01em}
.eyebrow{margin:26px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.big{margin:8px 0 0;font-size:clamp(34px,10vw,48px);line-height:.98;letter-spacing:-.035em}
.lead{margin:14px 0 0;font-size:16px;line-height:1.5}
.nick{display:inline-block;margin-top:14px;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.body{padding-top:24px;padding-bottom:40px}

.pill.navy{background:var(--ink);color:var(--bg)}

.cap{margin:12px 0 0;text-align:center;font-size:14px;color:var(--mut)}
.funnel{margin:28px auto 0;max-width:400px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.3}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.funnel svg{width:100%;height:auto;display:block;overflow:visible;font-family:"Red Rose","Noto Sans Thai","PingFang SC","Microsoft YaHei",sans-serif}
/* language dropdown */
.lang{position:relative;flex:none}
.ld{display:flex;align-items:center;gap:8px;min-height:44px;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 14px;font-size:14px;font-weight:700}
svg.fl{border-radius:2px;box-shadow:0 0 0 1px rgba(27,42,74,.35);flex:none}
.lm{position:absolute;top:100%;right:0;margin:8px 0 0;padding:6px;list-style:none;background:var(--white);border:2px solid var(--ink);border-radius:16px;min-width:170px;z-index:20;box-shadow:0 10px 24px rgba(27,42,74,.18)}
.lm[hidden]{display:none}
.lm button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:transparent;border:0;border-radius:10px;padding:0 10px;font-size:15px;text-align:left}
.lm button:hover,.lm button.on{background:var(--cream)}
.lm button.on{font-weight:700}
/* question + goal screens */
.qwrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:28px}
.prow{display:flex;align-items:center;gap:12px;margin-top:10px}
.circle{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.prog{flex:1;height:12px;border-radius:999px;background:var(--white);border:2px solid var(--ink);overflow:hidden}
.prog i{display:block;height:100%;background:var(--peach);transition:width .3s}
.pcount{font-size:14px;font-weight:700;white-space:nowrap}
.qtext{margin:36px 0 0;font-size:clamp(26px,7.4vw,32px);line-height:1.12;letter-spacing:-.03em}
.gh{margin:12px 0 0;font-size:15px;color:var(--mut)}
.answers{margin-top:0;padding-top:32px;display:flex;flex-direction:column;gap:10px}
.qwrap .answers .scale{margin-top:0}
.ans{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 16px;background:var(--white);border:2px solid var(--ink);border-radius:18px;text-align:left;font-size:16px;font-weight:500;width:100%}
.ans b{width:30px;height:30px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.ans .t{display:flex;flex-direction:column}
.ans .t strong{font-weight:700}
.ans .t small{font-size:14px;font-weight:400;color:var(--mut)}
.ans:hover{background:var(--cream)}
.ans.sel{background:var(--ink);color:var(--bg);font-weight:700}
.ans.sel .t small{color:var(--cream)}
.ans.sel b{background:var(--peach);color:var(--ink);border-color:var(--peach)}
.scale{display:flex;justify-content:space-between;gap:8px}
.sc{flex:1;max-width:72px;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:var(--white);font-family:"Red Rose",sans-serif;font-weight:700;font-size:22px;padding:0}
.sc:hover{background:var(--cream)}
.sc.sel{background:var(--ink);color:var(--bg)}
.ends{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:13px;line-height:1.3;color:var(--mut2)}
.ends span{max-width:45%}.ends span:last-child{text-align:right}
.hint{margin:8px 0 0;text-align:center;font-size:13px;color:var(--mut)}
/* results */
.sec{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;margin:8px 0}
.bar.leak{font-weight:700}
.bar span{width:132px;flex:none;line-height:1.25}
.bar div{flex:1;height:14px;background:var(--white);border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.bar div i{display:block;height:100%}
.gnote{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--mut2)}
.card{background:var(--white);border:2px solid var(--ink);border-radius:22px;padding:20px;margin-top:14px}
.card.tint{background:var(--cream)}
.card.trap{border-left:10px solid var(--coral)}
.card h2{font-size:22px;line-height:1.2}
.card h3{font-size:20px;line-height:1.2}
.card p{margin:8px 0 0;font-size:15px;line-height:1.6}
.card p.nk{margin-top:4px;font-weight:700;color:var(--coral-d)}
.yours{display:inline-block;margin-left:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 10px;font-size:12px;vertical-align:middle}
.allp h2{margin:26px 0 0;font-size:24px}
.cta{position:relative;overflow:hidden;margin-top:28px;background:var(--ink);color:var(--bg);border-radius:28px;padding:26px 22px}
.cta .deco2{position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;background:var(--coral)}
.cta>*{position:relative}
.cta .k{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--peach)}
.cta h2{margin:8px 0 0;font-size:28px;line-height:1.08;letter-spacing:-.03em}
.cta p.d{margin:12px 0 0;font-size:15px;line-height:1.55}
.cta .pill{margin-top:20px}
.note{margin:10px 0 0;font-size:13px;color:var(--cream);text-align:center;min-height:1em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.sq{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:16px;border:2px solid var(--ink);font-weight:700;font-size:15px;text-decoration:none;padding:6px 10px;text-align:center}
.sq.coral{background:var(--coral);color:var(--ink)}
.sq.plain{background:transparent}
.disc{margin:26px 0 0;font-size:12px;line-height:1.5;color:var(--mut);text-align:center}
html:lang(th) h1,html:lang(th) h2,html:lang(th) h3,html:lang(zh-Hans) h1,html:lang(zh-Hans) h2,html:lang(zh-Hans) h3{letter-spacing:0;line-height:1.3}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
</style></head>

 {n:"Volume",nick:"The Creature of Routine",tg:"Your days are full, just not of new people.",str:"You put yourself out there and meet people.",lead:"at the top of the Friendship Funnel",
  leak:"A Volume leak means your days are filled mostly with people you already know, so you rarely cross paths with potential new friends.",
  why:"Volume leaks are common for busy adults. Work, family, and errands can fill an entire day: the office, then the gym, then dinner, then a call with your mom or bedtime with the kids. There’s little room left to meet anyone new. But meeting new people regularly is how a social circle grows. Each new person is a chance to find someone whose company you enjoy and to see things from a different perspective.",

 {n:"Repeated Exposure",nick:"The Driveby Friend",tg:"You meet lots of people. You just don’t see the same ones often enough for it to stick.",str:"You keep showing up and become a familiar face.",lead:"at the second level of the Friendship Funnel",
  leak:"A Repeated Exposure leak means you meet new people, but you rarely see the same people often enough for familiarity to build. Most acquaintances stay acquaintances because the first conversation was also the last.",
  why:"Friendships grow from time spent together, not from one great conversation. Research suggests it takes dozens of hours together before an acquaintance becomes a friend, and we tend to like people more the more we see them. That’s why so many close friends start as the people who happened to be around: roommates, coworkers, classmates, the regulars at the same gym.<br><br>A Repeated Exposure leak is common when your social life is made of one-off encounters: a new event each week, a great chat, and then you never cross paths again. Nothing went wrong. There just wasn’t a second or third time to build on. You also don’t need to ask for a number on day one. When you keep showing up in the same place, a follow-up feels natural later.",
  fix:"Pick one activity or group that meets regularly (a weekly class, a run club, a board game night, a volunteer shift) and commit to going for the next 4 to 8 weeks, even on days you don’t feel like it. Treat it like a standing appointment. The goal isn’t to make a best friend in week one. It’s to become a familiar face. Around the third or fourth session, someone will say “hey, you’re back!” That’s when familiarity starts turning into friendship.",
  trap:"Dropping a group after one or two visits because it didn’t click right away. Familiarity takes a few weeks.",
  q:["I regularly spend time with the same people through where I live, work, study, or my hobbies.","I regularly attend the same activity or group, so I see the same people week after week.","When I meet someone I like, I tend to see them again within a couple of weeks, planned or not.","After a good first chat, I follow up and suggest meeting again.","When a plan falls through, I try at least once to reschedule instead of letting it fade."]},
 {n:"Integration",nick:"The Compartmentalizer",tg:"Your friends live in separate boxes: work, gym, brunch.",str:"Your friends get to see many sides of you.",lead:"at the third level of the Friendship Funnel",

  why:"Integration leaks happen subtly, and they’re not always a problem. When you click with someone in a gym class, keeping it in the gym can feel right. Integration only becomes important when you both want the friendship to go deeper. Seeing each other in a new context shows different sides of you both and gives you new things to bond over.",
  fix:"Think of two friends from different parts of your life who might get along, and invite them to a meal or drinks together. You can also invite one friend to do something outside your usual routine, like a walk instead of a workout. Either one creates a new setting for the friendship.",
  trap:"Forcing two friend groups together before either side feels settled.",
  q:["With my friends, I do a mix of things (meals, activities, trips), not the same routine every time.","I introduce my friends to each other and to my wider circle.","In the past couple of months, I’ve tried something new with a friend.","I’ve seen my newer friends both in groups and one-on-one.","My friends know people in other parts of my life, such as my family, coworkers, or other friends."]},

  why:"Deepen leaks can happen when expressing emotions feels difficult or unnatural. Cultural and gender norms shape how people open up, and a bad past experience can make you hesitant to try again. It’s worth working on because vulnerability is the foundation of close friendships. It replaces guarded, surface-level conversation with real trust.",
  fix:"Comfort with vulnerability builds slowly, so start small. The next time a friend asks how you’re doing, pause before answering. Instead of “I’m good” or a rundown of your week, describe how you actually feel. It may feel awkward at first, and it gets easier with practice.",

 {n:"Repeated Exposure (พบซ้ำ)",nick:"เพื่อนแบบแวะผ่าน",tg:"คุณพบคนมากมาย แต่ไม่ได้เจอคนเดิมบ่อยพอให้ความสัมพันธ์เติบโต",str:"คุณไปซ้ำอย่างสม่ำเสมอและกลายเป็นหน้าคุ้นตา",lead:"ระดับที่สองของกรวยมิตรภาพ",
  leak:"รอยรั่วด้าน Repeated Exposure หมายความว่าคุณพบคนใหม่ แต่ไม่ค่อยได้เจอคนเดิมซ้ำบ่อยพอให้ความคุ้นเคยก่อตัวขึ้น คนรู้จักส่วนใหญ่จึงยังเป็นแค่คนรู้จัก เพราะบทสนทนาครั้งแรกก็กลายเป็นครั้งสุดท้ายด้วย",
  why:"มิตรภาพเติบโตจากเวลาที่ได้อยู่ด้วยกัน ไม่ใช่จากบทสนทนาดี ๆ เพียงครั้งเดียว งานวิจัยชี้ว่าต้องใช้เวลาอยู่ด้วยกันหลายสิบชั่วโมงกว่าคนรู้จักจะกลายเป็นเพื่อน และเรามักชอบคนมากขึ้นเมื่อได้เจอเขาบ่อยขึ้น นี่คือเหตุผลที่เพื่อนสนิทหลายคนเริ่มจากคนที่บังเอิญอยู่ใกล้ตัว เช่น เพื่อนร่วมบ้าน เพื่อนร่วมงาน เพื่อนร่วมชั้น หรือขาประจำที่ยิมเดียวกัน<br><br>รอยรั่วด้าน Repeated Exposure พบได้บ่อยเมื่อชีวิตสังคมของคุณประกอบด้วยการพบกันแบบครั้งเดียว ไปงานใหม่ทุกสัปดาห์ คุยกันสนุก แล้วไม่ได้เจอกันอีก ไม่ได้มีอะไรผิดพลาด เพียงแต่ไม่มีครั้งที่สองหรือครั้งที่สามให้ต่อยอด และคุณไม่จำเป็นต้องขอเบอร์ตั้งแต่วันแรก เมื่อคุณไปที่เดิมซ้ำ ๆ การติดต่อกันภายหลังจะเป็นไปอย่างเป็นธรรมชาติ",
  fix:"เลือกกิจกรรมหรือกลุ่มที่จัดเป็นประจำหนึ่งอย่าง (คลาสรายสัปดาห์ ชมรมวิ่ง ค่ำคืนเล่นบอร์ดเกม หรือกิจกรรมอาสา) แล้วตั้งใจไปให้ครบ 4 ถึง 8 สัปดาห์ แม้วันที่ไม่อยากไปก็ตาม ถือว่าเป็นนัดประจำ เป้าหมายไม่ใช่การได้เพื่อนสนิทตั้งแต่สัปดาห์แรก แต่คือการเป็นหน้าคุ้นตา ราวครั้งที่สามหรือสี่ จะมีคนทักว่า “อ้าว มาอีกแล้ว!” นั่นคือจังหวะที่ความคุ้นเคยเริ่มกลายเป็นมิตรภาพ",
  trap:"เลิกไปกลุ่มหลังไปแค่หนึ่งหรือสองครั้ง เพราะยังไม่รู้สึกถูกคอทันที ความคุ้นเคยต้องใช้เวลาไม่กี่สัปดาห์",
  q:["ฉันใช้เวลากับคนกลุ่มเดิมเป็นประจำ ผ่านที่ที่ฉันอยู่ ทำงาน เรียน หรืองานอดิเรก","ฉันไปทำกิจกรรมหรือเข้ากลุ่มเดิมเป็นประจำ จึงได้เจอคนกลุ่มเดิมทุกสัปดาห์","เมื่อพบคนที่ถูกใจ ฉันมักได้เจอเขาอีกภายในสองสามสัปดาห์ ไม่ว่าจะนัดหรือบังเอิญ","หลังจากคุยกันถูกคอครั้งแรก ฉันติดต่อไปและชวนนัดเจอกันอีก","เมื่อแผนล่ม ฉันพยายามนัดใหม่อย่างน้อยหนึ่งครั้ง แทนที่จะปล่อยให้เงียบหายไป"]},
 {n:"Integration (เชื่อมโยง)",nick:"คนแยกกล่องเพื่อน",tg:"เพื่อนของคุณอยู่คนละกล่อง: ที่ทำงาน ยิม บรันช์",str:"เพื่อน ๆ ได้เห็นคุณหลายด้าน",lead:"ระดับที่สามของกรวยมิตรภาพ",
  leak:"รอยรั่วด้าน Integration หมายความว่าคุณพบคนใหม่และได้เจอกันซ้ำ แต่มิตรภาพยังอยู่ในบริบทเดียว คุณเจอเพื่อนที่ทำงานแค่ที่ทำงาน เพื่อนที่ยิมแค่ที่ยิม เพื่อนที่กินบรันช์แค่ตอนบรันช์ พวกเขาจึงไม่ค่อยได้รู้จักคุณในด้านอื่น ๆ ของชีวิต",
  why:"รอยรั่วด้าน Integration เกิดขึ้นแบบแนบเนียนและไม่ได้เป็นปัญหาเสมอไป เมื่อคุณถูกคอกับใครสักคนในคลาสยิม การให้มิตรภาพอยู่แค่ในยิมก็รู้สึกลงตัวดี การเชื่อมโยงจะสำคัญก็ต่อเมื่อทั้งสองฝ่ายอยากให้มิตรภาพลึกซึ้งขึ้น การได้อยู่ด้วยกันในบริบทใหม่ ๆ ช่วยให้เห็นอีกด้านของกันและกัน และมีเรื่องใหม่ ๆ ให้ผูกพันกัน",
  fix:"ลองนึกถึงเพื่อนสองคนจากส่วนต่าง ๆ ของชีวิตที่น่าจะเข้ากันได้ แล้วชวนมากินข้าวหรือดื่มด้วยกัน หรือจะชวนเพื่อนสักคนไปทำอะไรนอกกิจวัตรปกติ เช่น เดินเล่นแทนการออกกำลังกายก็ได้ ทั้งสองแบบช่วยสร้างบริบทใหม่ให้มิตรภาพ",
  trap:"ดึงเพื่อนสองกลุ่มมารวมกันโดยที่ทั้งสองฝ่ายยังไม่สนิทใจ",
  q:["ฉันทำกิจกรรมหลากหลายกับเพื่อน (กินข้าว ทำกิจกรรม ท่องเที่ยว) ไม่ใช่แค่รูปแบบเดิม ๆ ทุกครั้ง","ฉันแนะนำเพื่อน ๆ ให้รู้จักกัน และแนะนำให้รู้จักกับวงสังคมที่กว้างขึ้นของฉัน","ในช่วงสองสามเดือนที่ผ่านมา ฉันลองทำอะไรใหม่ ๆ กับเพื่อน","ฉันเคยเจอเพื่อนใหม่ ๆ ทั้งในกลุ่มและแบบตัวต่อตัว","เพื่อนของฉันรู้จักคนในส่วนอื่น ๆ ของชีวิตฉัน เช่น ครอบครัว เพื่อนร่วมงาน หรือเพื่อนกลุ่มอื่น"]},
 {n:"Deepen (เปิดใจลึกซึ้ง)",nick:"เพื่อนสาย “สบายดี”",tg:"คุณอยู่ข้างเพื่อนเสมอ แต่ไม่ค่อยให้เขาเห็นตัวตนจริง",str:"คุณให้คนอื่นได้รู้จักตัวตนจริงของคุณ",lead:"ด้านล่างสุดของกรวยมิตรภาพ",
  leak:"รอยรั่วด้าน Deepen หมายความว่าคุณมีเพื่อนและใช้เวลากับเพื่อนในบริบทที่หลากหลาย แต่บางครั้งยังไม่กล้าเปิดเผยความรู้สึกที่แท้จริง ซึ่งเป็นสิ่งที่ทำให้มิตรภาพใกล้ชิดขึ้น",
  why:"รอยรั่วด้าน Deepen อาจเกิดขึ้นเมื่อการแสดงอารมณ์รู้สึกยากหรือไม่เป็นธรรมชาติ บรรทัดฐานทางวัฒนธรรมและเพศมีผลต่อวิธีที่คนเปิดใจ และประสบการณ์แย่ ๆ ในอดีตอาจทำให้ลังเลที่จะลองอีกครั้ง เรื่องนี้คุ้มค่าที่จะพัฒนา เพราะการเปิดใจเป็นรากฐานของมิตรภาพที่ใกล้ชิด มันเปลี่ยนบทสนทนาที่ระแวดระวังและผิวเผินให้เป็นความไว้วางใจที่แท้จริง",
  fix:"ความสบายใจกับการเปิดใจค่อย ๆ สร้างขึ้นได้ เริ่มจากเรื่องเล็ก ๆ ครั้งหน้าที่เพื่อนถามว่าเป็นไงบ้าง ลองหยุดคิดก่อนตอบ แทนที่จะตอบว่า “สบายดี” หรือเล่าสรุปสัปดาห์ ลองบอกว่าตอนนี้รู้สึกอย่างไรจริง ๆ ตอนแรกอาจรู้สึกเก้อ แต่จะง่ายขึ้นเมื่อฝึกบ่อย ๆ",
  trap:"เปิดเผยมากเกินไปตั้งแต่แรกเพื่อให้สนิทเร็ว ความลึกซึ้งได้ผลที่สุดเมื่อค่อย ๆ แลกเปลี่ยนกันไปมา",
  q:["ฉันเล่าเรื่องจริงที่เกิดขึ้นในชีวิต ไม่ใช่แค่อัปเดตผิวเผิน","ฉันขอความช่วยเหลือหรือกำลังใจจากเพื่อนเมื่อต้องการ","เมื่อมีคนถามว่าเป็นอย่างไรบ้าง ฉันตอบตามความจริง แทนที่จะตอบแค่ “สบายดี”","หลังไปใช้เวลากับคนใหม่ ฉันรู้สึกว่าเขารู้จักฉันพอ ๆ กับที่ฉันรู้จักเขา","เมื่อเพื่อนเล่าเรื่องอะไรให้ฟัง ฉันถามต่อลึกกว่าการคุยเล่นทั่วไป"]}
 ]},

 function pick(idxs,better){var b=idxs[0];idxs.forEach(function(k){if(better(sc[k],sc[b]))b=k});return b}
 var all=[0,1,2,3],snap=(G===SNAP),scope=GSCOPE[G]||all;
 var lowAll=pick(all,function(a,b){return a<b});
 var leak=pick(scope,function(a,b){return a<b});
 var strong=snap?pick(all,function(a,b){return a>b}):pick(all.filter(function(k){return k!==leak}),function(a,b){return a>b});
 var focus=snap?strong:leak, lvl=snap?lowAll:leak, s=S[lvl];
 var bars='';
 S.forEach(function(x,k){
  bars+='<div class="bar'+(k==focus?' leak':'')+'"><span>'+x.n+(k==focus?' · '+(snap?t.strongTag:t.leakTag):'')+'</span><div role="img" aria-label="'+sc[k]+'/'+mx+'"><i style="width:'+(sc[k]/mx*100)+'%;background:'+(k==focus?'#1B2A4A':SCOL[k])+'"></i></div></div>';
 });
 var hero=snap
  ?'<p class="eyebrow">'+t.snapIn+'</p><h1 class="big">'+ENAMES[strong]+'</h1><p class="lead">'+S[strong].str+'</p>'
  :'<p class="eyebrow">'+t.yourLeakIn+'</p><h1 class="big">'+ENAMES[leak]+'</h1><span class="nick">'+t.youAre(S[leak].nick.replace(/“/g,'‘').replace(/”/g,'’'))+'</span><p class="lead">'+S[leak].tg+'</p>';
 var cards='';
 if(snap){
  cards+='<div class="card tint"><h2>'+t.hLevel+'</h2><p>'+t.levelP(s.n,s.nick)+'</p><p>'+s.fix+'</p></div>'
   +'<div class="card trap"><h2>'+t.hTrap+'</h2><p>'+s.trap+'</p></div>';
 }else{
  cards+='<div class="card"><h2>'+t.hLeak+'</h2><p>'+t.lead(s.lead,s.n)+s.leak+'</p></div>'
   +'<div class="card"><h2>'+t.hWhy+'</h2><p>'+s.why+'</p></div>'
   +'<div class="card tint"><h2>'+t.hFix+'</h2><p>'+s.fix+'</p></div>'
   +'<div class="card trap"><h2>'+t.hTrap+'</h2><p>'+s.trap+'</p></div>'
   +'<div class="card"><h2>'+t.hStrong+'</h2><p><b>'+S[strong].n+'</b>. '+S[strong].str+'</p></div>';
 }
 var note=(!snap&&lowAll!==leak)?'<p class="gnote">'+t.note(S[lowAll].n,t.goals[G].t)+'</p>':'';
 var cta='<div class="cta"><div class="deco2" aria-hidden="true"></div><p class="k">'+t.ctaK+'</p><h2>'+t.ctaH+'</h2><p class="d">'+t.ctaP(s.n)+'</p>';
 cta+=PLAYBOOK_URL?'<a class="pill peach" href="'+PLAYBOOK_URL+'" target="_blank" rel="noopener">'+t.ctaB+'</a>':'<button class="pill peach" id="pb">'+t.ctaB+'</button><p class="note" id="pn" aria-live="polite"></p>';
 cta+='</div>';
 app.innerHTML='<section class="hero"><div class="deco"><i></i></div><div class="wrap">'+topbar()+hero+'</div></section>'
 +'<div class="wrap body"><p class="sec">'+t.yourFunnel+'</p><div class="funnel" style="margin-top:10px">'+funnelSVG(focus,snap)+'</div><div style="height:18px"></div>'+bars+note
 +cards
 +'<button class="more" id="more" aria-expanded="false" aria-controls="allp">'+t.moreLink+'</button>'
 +'<div class="allp" id="allp" hidden><h2>'+t.moreH+'</h2>'+leaksHTML(lvl)+'</div>'
 +cta
 +'<div class="two"><button class="sq coral" id="sh">'+t.share+'</button><button class="sq plain" id="r">'+t.retake+'</button></div>'
 +'<p class="disc">'+t.disc+'</p></div>';
 document.getElementById("r").onclick=startQuiz;
 var pb=document.getElementById("pb");if(pb)pb.onclick=function(){document.getElementById("pn").textContent=t.soon};
 var mb=document.getElementById("more"),ap=document.getElementById("allp");
 mb.onclick=function(){var o=ap.hidden;ap.hidden=!o;mb.setAttribute("aria-expanded",o?"true":"false")};
 var sh=document.getElementById("sh");
 sh.onclick=function(){
  var tx=snap?t.shareSnap(ENAMES[strong]):t.shareText(ENAMES[leak],S[leak].nick),url="";try{url=location.href}catch(e){}
  try{
   if(navigator.share){navigator.share({text:tx,url:url}).catch(function(){})}
   else if(navigator.clipboard){navigator.clipboard.writeText(tx+" "+url).then(function(){sh.textContent=t.copied},function(){})}
  }catch(e){}
 };
}
render();
</script></body></html>
